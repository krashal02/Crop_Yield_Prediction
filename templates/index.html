<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yield Crop Prediction</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-orange-50">

  <div class="container w-[80vw] bg-orange-200 px-6 py-6 mx-auto my-[2%] rounded-lg shadow-lg">
    <h2 class="text-center text-yellow-900 text-[2vw] font-semibold mb-6">🌾 Crop Yield Prediction</h2>

    <form action="/predict" method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Year -->
      <div>
        <label for="Year" class="block text-gray-700 font-semibold mb-1">Year (1990–2014)</label>
        <input 
          type="number" 
          id="Year" 
          name="Year" 
          placeholder="Enter year between 1990–2014" 
          min="1990" 
          max="2014"
          required
          class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-400"
        />
      </div>

      <!-- Average Rainfall -->
      <div>
        <label for="AverageRainfall" class="block text-gray-700 font-semibold mb-1">Average Rainfall (mm)</label>
        <input 
          type="number" 
          id="AverageRainfall" 
          name="AverageRainfall" 
          placeholder="Enter average rainfall" 
          required
          step="0.01"
          class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-400"
        />
      </div>

      <!-- Pesticide -->
      <div>
        <label for="Pesticide" class="block text-gray-700 font-semibold mb-1">Pesticide Used (tons)</label>
        <input 
          type="number" 
          id="Pesticide" 
          name="Pesticide" 
          placeholder="Enter pesticide used" 
          required
          step="0.01"
          class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-400"
        />
      </div>

      <!-- Average Temperature -->
      <div>
        <label for="AverageTemp" class="block text-gray-700 font-semibold mb-1">Average Temperature (°C)</label>
        <input 
          type="number" 
          id="AverageTemp" 
          name="AverageTemp" 
          placeholder="Enter average temperature (e.g. 17.21)" 
          required
          step="0.01"
          class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-400"
        />
      </div>

      <!-- Area -->
      <div>
        <label for="Area" class="block text-gray-700 font-semibold mb-1">Area</label>
        <input 
          type="text" 
          id="Area" 
          name="Area" 
          placeholder="Enter Country Name" 
          required
          class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-400"
        />
      </div>

      <!-- Item -->
      <div>
        <label for="Item" class="block text-gray-700 font-semibold mb-1">Item</label>
        <input 
          type="text" 
          id="Item" 
          name="Item" 
          placeholder="Enter Crop Name" 
          required
          class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-400"
        />
      </div>

      <!-- Submit Button -->
      <div class="md:col-span-2 flex flex-col items-center">
        <button 
          type="submit" 
          class="w-full md:w-[60%] bg-green-600 text-white py-2 rounded-lg font-semibold hover:bg-green-700 transition duration-200 mt-4">
          Predict Yield 🌱
        </button>

        <!-- Prediction Result (below the button) -->
        {% if prediction_text %}
          <div class="bg-green-100 border border-green-400 text-green-800 px-6 py-3 rounded-lg mt-4 text-center w-full md:w-[60%] shadow-md">
            {{ prediction_text }}
          </div>
        {% endif %}
      </div>

    </form>
  </div>

</body>
</html>
